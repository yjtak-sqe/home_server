<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{APP_NAME}}</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="logo">₿</span>
    <div>
      <h1>{{APP_NAME}}</h1>
      <div class="ver">v{{APP_VERSION}} · 골든크로스 + RSI 전략</div>
    </div>
    <div class="status-dot" id="statusDot"></div>
    <span class="status-txt" id="statusTxt">연결 안됨</span>
  </div>
</div>

<div class="container">
  <!-- API 연결 패널 -->
  <div class="panel" id="connectPanel">
    <h2>🔑 업비트 API 연결</h2>
    <p class="hint">업비트 마이페이지 → Open API 관리에서 발급. <b>출금 권한은 부여하지 마세요.</b></p>
    <div class="key-row">
      <input id="accessKey" type="text" placeholder="Access Key" autocomplete="off">
      <input id="secretKey" type="password" placeholder="Secret Key" autocomplete="off">
      <button class="btn-connect" onclick="connect()">연결</button>
    </div>
    <div class="err-banner" id="connectErr" hidden></div>
  </div>

  <!-- 제어 패널 -->
  <div class="panel">
    <div class="ctrl-row">
      <label>
        코인
        <select id="tickerSel">
          <option value="KRW-BTC">BTC</option>
          <option value="KRW-ETH">ETH</option>
          <option value="KRW-XRP">XRP</option>
          <option value="KRW-SOL">SOL</option>
          <option value="KRW-DOGE">DOGE</option>
        </select>
      </label>
      <label>
        투자금액 (원)
        <input type="number" id="tradeAmt" value="10000" min="5000" step="1000">
      </label>
      <button class="btn-start" id="startBtn" onclick="toggleBot()">▶ 시작</button>
    </div>
  </div>

  <!-- 지표 카드 -->
  <div class="stat-grid">
    <div class="stat">
      <div class="num" id="sPrice">-</div>
      <div class="lbl">현재가 (KRW)</div>
    </div>
    <div class="stat">
      <div class="num" id="sKrw">-</div>
      <div class="lbl">보유 KRW</div>
    </div>
    <div class="stat">
      <div class="num" id="sCoin">-</div>
      <div class="lbl">보유 코인</div>
    </div>
    <div class="stat" id="sProfitCard">
      <div class="num" id="sProfit">-</div>
      <div class="lbl">평가손익</div>
    </div>
    <div class="stat">
      <div class="num" id="sRsi">-</div>
      <div class="lbl">RSI</div>
    </div>
    <div class="stat">
      <div class="num" id="sSignal">-</div>
      <div class="lbl">신호</div>
    </div>
  </div>

  <!-- 차트 -->
  <div class="panel">
    <h2>📈 차트 <span class="chart-legend"><span class="leg ma5">MA5</span><span class="leg ma20">MA20</span></span></h2>
    <div id="chart"></div>
  </div>

  <!-- 거래 내역 -->
  <div class="panel">
    <h2>📋 거래 내역</h2>
    <div class="err-banner" id="botErr" hidden></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>시간</th><th>구분</th><th>가격</th><th>금액</th></tr></thead>
        <tbody id="tradeTbody"></tbody>
      </table>
      <div class="empty" id="tradeEmpty">거래 내역이 없습니다.</div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
