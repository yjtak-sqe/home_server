services:

  # ──────────────────────────────────────────
  # Homarr — 홈 대시보드 (서비스 바로가기)
  # 접속: http://서버IP:7575
  # ──────────────────────────────────────────
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homarr_config:/app/data/configs
      - homarr_icons:/app/public/icons
      - homarr_data:/data
    ports:
      - "7575:7575"

  # ──────────────────────────────────────────
  # Portainer — Docker 컨테이너 관리
  # 접속: http://서버IP:9000
  # ──────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"

  # ──────────────────────────────────────────
  # Glances — 시스템 모니터링 (CPU / RAM / 디스크)
  # 접속: http://서버IP:61208
  # ──────────────────────────────────────────
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    ports:
      - "61208:61208"

  # ──────────────────────────────────────────
  # FileBrowser — 웹 파일 탐색기
  # 접속: http://서버IP:8080
  # 초기 계정: admin / admin (첫 로그인 후 변경 필수)
  # ──────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - /:/srv/host:ro          # 서버 전체 파일시스템 (읽기 전용)
      - ~/data:/srv/data        # 읽기/쓰기 가능한 데이터 폴더
      - filebrowser_db:/database
    ports:
      - "8080:80"
    environment:
      - FB_BASEURL=/

  # ──────────────────────────────────────────
  # Vaultwarden — 자체 호스팅 비밀번호 관리자
  # 접속: https://tak.tail9d038f.ts.net:8181
  # Bitwarden 앱/확장 프로그램과 호환
  # ──────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
      - /etc/tailscale-certs:/certs:ro
    ports:
      - "8181:8181"
    environment:
      - SIGNUPS_ALLOWED=true   # 계정 만든 후 false 로 변경 권장
      - ROCKET_TLS={certs="/certs/tak.tail9d038f.ts.net.crt",key="/certs/tak.tail9d038f.ts.net.key"}
      - ROCKET_PORT=8181

  # ──────────────────────────────────────────
  # 카탈로그 교정 시스템 — 웹 앱 (와이프 업무용)
  # 접속: http://서버IP:8090
  # 기획자료 ↔ 카탈로그 비교 / 새 카탈로그 생성
  # ──────────────────────────────────────────
  catalog-manager:
    build: ./catalog_manager
    image: catalog-manager:latest
    container_name: catalog-manager
    restart: unless-stopped
    volumes:
      - catalog_jobs:/data/jobs
    ports:
      - "8090:8000"
    environment:
      - CATALOG_DATA_DIR=/data/jobs
      - CATALOG_JOB_TTL=86400   # 결과 파일 보관 시간(초). 기본 24시간

  # ──────────────────────────────────────────
  # Wetty — 브라우저 웹 터미널
  # 접속: https://tak.tail9d038f.ts.net:3000
  # ──────────────────────────────────────────
  wetty:
    image: wettyoss/wetty:latest
    container_name: wetty
    restart: unless-stopped
    volumes:
      - /etc/tailscale-certs:/certs:ro
    ports:
      - "3000:3000"
    command: >
      --ssh-host=host.docker.internal
      --ssh-port=22
      --ssh-user=tak
      --base=/
      --ssl-key=/certs/tak.tail9d038f.ts.net.key
      --ssl-cert=/certs/tak.tail9d038f.ts.net.crt

  # ──────────────────────────────────────────
  # Home Assistant — 홈 IoT 통합 제어
  # 접속: http://서버IP:8123
  # ──────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host        # IoT 기기 로컬 탐색에 필요
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Seoul

  # ──────────────────────────────────────────
  # Uptime Kuma — 서비스 모니터링 + 알림
  # 접속: http://서버IP:3001
  # ──────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"

  # ──────────────────────────────────────────
  # code-server — 브라우저 VS Code IDE
  # 접속: https://tak.tail9d038f.ts.net:8443
  # 외부에서 브라우저로 완전한 VS Code 환경 사용
  # ──────────────────────────────────────────
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    volumes:
      - /home/tak:/home/tak                  # 서버 홈 디렉토리 직접 접근
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - code_server_config:/config
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - PASSWORD=                            # 비밀번호 직접 설정 필요 (아래 참고)
      - SUDO_PASSWORD=                       # sudo 비밀번호 (선택)

  # ──────────────────────────────────────────
  # Upbit 자동매매 — 골든크로스 + RSI 전략
  # 접속: http://서버IP:8091
  # ──────────────────────────────────────────
  # ──────────────────────────────────────────
  # 한글 자동차 주차 게임 — 아이 교육용
  # 접속: http://서버IP:8092
  # ──────────────────────────────────────────
  hangul-car:
    build: ./hangul_car
    image: hangul-car:latest
    container_name: hangul-car
    restart: unless-stopped
    ports:
      - "8092:80"

  upbit-trader:
    build: ./upbit_trader
    image: upbit-trader:latest
    container_name: upbit-trader
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8091:8000"

volumes:
  homarr_config:
  homarr_icons:
  homarr_data:
  portainer_data:
  filebrowser_db:
  vaultwarden_data:
  catalog_jobs:
  homeassistant_config:
  uptime_kuma_data:
  code_server_config:
