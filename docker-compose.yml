services:

  # ──────────────────────────────────────────
  # Homarr — 홈 대시보드 (서비스 바로가기)
  # 접속: http://서버IP:7575
  # ──────────────────────────────────────────
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homarr_config:/app/data/configs
      - homarr_icons:/app/public/icons
      - homarr_data:/data
    ports:
      - "7575:7575"

  # ──────────────────────────────────────────
  # Portainer — Docker 컨테이너 관리
  # 접속: http://서버IP:9000
  # ──────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"

  # ──────────────────────────────────────────
  # Glances — 시스템 모니터링 (CPU / RAM / 디스크)
  # 접속: http://서버IP:61208
  # ──────────────────────────────────────────
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    ports:
      - "61208:61208"

  # ──────────────────────────────────────────
  # FileBrowser — 웹 파일 탐색기
  # 접속: http://서버IP:8080
  # 초기 계정: admin / admin (첫 로그인 후 변경 필수)
  # ──────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - /:/srv/host:ro          # 서버 전체 파일시스템 (읽기 전용)
      - ~/data:/srv/data        # 읽기/쓰기 가능한 데이터 폴더
      - filebrowser_db:/database
    ports:
      - "8080:80"
    environment:
      - FB_BASEURL=/

  # ──────────────────────────────────────────
  # Vaultwarden — 자체 호스팅 비밀번호 관리자
  # 접속: https://tak.tail9d038f.ts.net:8181
  # Bitwarden 앱/확장 프로그램과 호환
  # ──────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
      - /etc/tailscale-certs:/certs:ro
    ports:
      - "8181:8181"
    environment:
      - SIGNUPS_ALLOWED=true   # 계정 만든 후 false 로 변경 권장
      - ROCKET_TLS={certs="/certs/tak.tail9d038f.ts.net.crt",key="/certs/tak.tail9d038f.ts.net.key"}
      - ROCKET_PORT=8181

  # ──────────────────────────────────────────
  # 카탈로그 교정 시스템 — 웹 앱 (와이프 업무용)
  # 접속: http://서버IP:8090
  # 기획자료 ↔ 카탈로그 비교 / 새 카탈로그 생성
  # ──────────────────────────────────────────
  catalog-manager:
    build: ./catalog_manager
    image: catalog-manager:latest
    container_name: catalog-manager
    restart: unless-stopped
    volumes:
      - catalog_jobs:/data/jobs
    ports:
      - "8090:8000"
    environment:
      - CATALOG_DATA_DIR=/data/jobs
      - CATALOG_JOB_TTL=86400   # 결과 파일 보관 시간(초). 기본 24시간

  # ──────────────────────────────────────────
  # Wetty — 브라우저 웹 터미널
  # 접속: http://서버IP:3000
  # Tailscale로 외부에서 접속 → 서버 터미널 사용 가능
  # ──────────────────────────────────────────
  wetty:
    image: wettyoss/wetty:latest
    container_name: wetty
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: --ssh-host=host.docker.internal --ssh-port=22 --ssh-user=tak --base=/

volumes:
  homarr_config:
  homarr_icons:
  homarr_data:
  portainer_data:
  filebrowser_db:
  vaultwarden_data:
  catalog_jobs:
