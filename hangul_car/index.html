body { background: #1a237e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
#wordUI {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: rgba(10,15,50,0.88); border: 2px solid #4A80C0;
  border-radius: 12px; padding: 8px 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  z-index: 9999; font-family: "Malgun Gothic", sans-serif;
}
#wordUI label { color: #aaddff; font-size: 14px; white-space: nowrap; }
#wordInput {
  width: 130px; padding: 5px 10px; border-radius: 7px;
  border: 1.5px solid #4A80C0; background: #0a1230;
  color: #fff; font-size: 18px; font-family: "Malgun Gothic", sans-serif;
  outline: none; letter-spacing: 4px; text-align: center;
}
#wordInput:focus { border-color: #64B5F6; box-shadow: 0 0 6px #64B5F690; }
#wordStartBtn {
  padding: 6px 16px; border-radius: 7px; border: none;
  background: #1565C0; color: #fff; font-size: 14px;
  font-family: "Malgun Gothic", sans-serif; cursor: pointer;
  transition: background 0.15s;
}
#wordStartBtn:hover { background: #1976D2; }
#wordErr { color: #ff8080; font-size: 12px; display: none; }
</style>
</head>

const carBlobUrls = {};
function preloadCarTextures(scene) {
  CAR_TYPES.forEach(({id, svg}) => {
    const key = 'car_' + id;
    if (scene.textures.exists(key)) return;
    if (!carBlobUrls[id]) {
      carBlobUrls[id] = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
    }
    scene.load.image(key, carBlobUrls[id]);
  });
}

let wordCharDefs = null;  // 단어 모드: 미리 계산된 글자별 주차 레이아웃

// ── 한글 음절 자모 분해 기반 주차 레이아웃 ──────────────────────────────────
// 폰트/캔버스 의존 없이 유니코드 자모를 분해해서 CHARS 경로를 조합
const _CHO  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const _JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const _JONG = [null,'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
// 겹자음/합성모음 → CHARS에 있는 기본 자모로 매핑
const _CHO_NORM  = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const _JUNG_NORM = {'ㅐ':'ㅏ','ㅒ':'ㅑ','ㅔ':'ㅓ','ㅖ':'ㅕ',
                    'ㅘ':'ㅗ','ㅙ':'ㅗ','ㅚ':'ㅗ','ㅝ':'ㅜ','ㅞ':'ㅜ','ㅟ':'ㅜ','ㅢ':'ㅡ'};
const _JONG_NORM = {'ㄲ':'ㄱ','ㄳ':'ㄱ','ㄵ':'ㄴ','ㄶ':'ㄴ',
                    'ㄺ':'ㄹ','ㄻ':'ㄹ','ㄼ':'ㄹ','ㄽ':'ㄹ','ㄾ':'ㄹ','ㄿ':'ㄹ','ㅀ':'ㄹ',
                    'ㅄ':'ㅂ','ㅆ':'ㅅ'};
const _HORIZ_V   = new Set(['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ']);

// 자모 하나의 주차 레이아웃 (원 타입은 작은 사각형으로 대체)
function _jamoDef(ch) {
  if (!ch) return { path:[[0,0]], rows:1, cols:1 };
  const key = _CHO_NORM[ch] || ch;
  const d = CHARS[key];
  if (!d) return { path:[[0,0],[0,1],[0,2]], rows:1, cols:3 };
  if (d.type === 'circle') return { path:[[0,0],[0,1],[1,1],[1,0]], rows:2, cols:2 };
  return d;
}

// 한글 음절(가-힣)을 자모 분해해서 공간 배치된 복합 주차 레이아웃 생성
function _syllableDef(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  const jongIdx = code % 28;
  const jungIdx = Math.floor(code / 28) % 21;
  const choIdx  = Math.floor(code / 28 / 21);

  const choJ  = _CHO_NORM[_CHO[choIdx]]  || _CHO[choIdx];
  const jungJ = _JUNG_NORM[_JUNG[jungIdx]] || _JUNG[jungIdx];
  const jongRaw = _JONG[jongIdx];
  const jongJ = jongRaw ? (_JONG_NORM[jongRaw] || jongRaw) : null;

  const cd = _jamoDef(choJ);
  const jd = _jamoDef(jungJ);
  const nd = jongJ ? _jamoDef(jongJ) : null;

  let cells, rows, cols;
  if (_HORIZ_V.has(jungJ)) {
    // 수평 모음(ㅗ,ㅛ,ㅜ,ㅠ,ㅡ): 초성 위, 중성 아래, 종성 더 아래
    cols = Math.max(cd.cols, jd.cols, nd ? nd.cols : 0);
    cells = [
      ...cd.path.map(([r,c]) => [r, c]),
      ...jd.path.map(([r,c]) => [r + cd.rows, c]),
    ];
    rows = cd.rows + jd.rows;
    if (nd) { cells.push(...nd.path.map(([r,c]) => [r + rows, c])); rows += nd.rows; }
  } else {
    // 수직 모음(ㅏ,ㅑ,ㅓ,ㅕ,ㅣ): 초성 왼쪽, 중성 오른쪽, 종성 아래
    const topRows = Math.max(cd.rows, jd.rows);
    cells = [
      ...cd.path.map(([r,c]) => [r, c]),
      ...jd.path.map(([r,c]) => [r, c + cd.cols]),
    ];
    rows = topRows; cols = cd.cols + jd.cols;
    if (nd) {
      cells.push(...nd.path.map(([r,c]) => [r + topRows, c]));
      rows += nd.rows; cols = Math.max(cols, nd.cols);
    }
  }
  return { path: _buildSnakePath(cells), rows, cols };
}

function getCharDef(ch) {
  if (CHARS[ch]) return CHARS[ch];
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code >= 0 && code <= 11171) return _syllableDef(ch);  // 한글 음절
  return { path:[[0,0],[0,1],[0,2],[1,2],[1,1],[1,0]], rows:2, cols:3 };  // 기타 기본값
}

// 채워진 셀들을 탐욕적 최근접 이웃으로 순서화 (뱀 경로)
function _buildSnakePath(cells) {
  const set = new Set(cells.map(([r,c])=>`${r},${c}`));
  const visited = new Set();
  const sorted = cells.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const path = [sorted[0]];
  visited.add(`${sorted[0][0]},${sorted[0][1]}`);
  while (path.length < cells.length) {
    const [cr,cc] = path[path.length-1];
    // 인접 셀 우선
    let found = false;
    for (const [nr,nc] of [[cr-1,cc],[cr,cc+1],[cr+1,cc],[cr,cc-1]]) {
      const k=`${nr},${nc}`;
      if (set.has(k)&&!visited.has(k)) { path.push([nr,nc]); visited.add(k); found=true; break; }
    }
    if (!found) {
      // 가장 가까운 미방문 셀로 점프
      let minD=Infinity, next=null;
      for (const [r,c] of cells) {
        if (!visited.has(`${r},${c}`)) {
          const d=Math.abs(r-cr)+Math.abs(c-cc);
          if (d<minD){minD=d;next=[r,c];}
        }
      }
      if (!next) break;
      path.push(next); visited.add(`${next[0]},${next[1]}`);
    }
  }
  return path;
}

const CHAR_GROUPS = {
  '자음': ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],
  '모음': ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'],
};

function cellAngle(path, i) {
  let dR, dC;
  if (i < path.length - 1) {
    dR = path[i+1][0] - path[i][0];
    dC = path[i+1][1] - path[i][1];
  } else {
    dR = path[i][0] - path[i-1][0];
    dC = path[i][1] - path[i-1][1];
  }
  // 비인접 점프도 주요 방향으로 처리
  if (Math.abs(dC) >= Math.abs(dR)) return dC >= 0 ? 90 : 270;
  return dR > 0 ? 180 : 0;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.75; u.pitch=1.3;
  window.speechSynthesis.speak(u);
}

function drawClouds(scene, positions) {
  positions.forEach(([x,y]) => {
    const g = scene.add.graphics().fillStyle(0xffffff,0.82);
    [[0,0,22],[21,-6,26],[44,0,20],[21,12,18]].forEach(([dx,dy,r])=>g.fillCircle(x+dx,y+dy,r));
  });
}

// ── 단어 입력 UI 핸들러 ──────────────────────────────────────────────────
function showWordUI() { document.getElementById('wordUI').style.display = ''; }
function hideWordUI() { document.getElementById('wordUI').style.display = 'none'; }

function startWordGame() {
  const raw = document.getElementById('wordInput').value.trim();
  const errEl = document.getElementById('wordErr');
  if (!raw) { errEl.textContent = '글자를 입력해주세요'; errEl.style.display='inline'; return; }
  if ([...raw].length > 5) { errEl.textContent = '최대 5글자까지 가능해요'; errEl.style.display='inline'; return; }
  errEl.style.display = 'none';

  currentWord = [...raw];
  currentWordIdx = 0;
  wordCharDefs = currentWord.map(ch => getCharDef(ch));  // 동기 계산 (자모 분해)
  hideWordUI();

  const game = window.__phaserGame;
  if (game) {
    game.scene.getScene('Menu').cameras.main.fadeOut(220);
    setTimeout(() => game.scene.start('Game', { ch: currentWord[0], wordMode: true }), 220);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('wordStartBtn').addEventListener('click', startWordGame);

  const wordInput = document.getElementById('wordInput');
  wordInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') startWordGame();
  });

  // wordUI 클릭이 Phaser 캔버스로 관통되지 않도록 차단
  const wordUI = document.getElementById('wordUI');
  wordUI.addEventListener('pointerdown', e => e.stopPropagation(), true);
  wordUI.addEventListener('mousedown',   e => e.stopPropagation(), true);
  wordUI.addEventListener('touchstart',  e => e.stopPropagation(), true);

  // input 포커스 중 Phaser 입력 비활성화
  wordInput.addEventListener('focus', () => {
    const scene = window.__phaserGame?.scene?.getScene('Menu');
    if (scene?.input) scene.input.enabled = false;
  });
  wordInput.addEventListener('blur', () => {
    const scene = window.__phaserGame?.scene?.getScene('Menu');
    if (scene?.input) scene.input.enabled = true;
  });
});

// ── MenuScene ─────────────────────────────────────────────────────────────
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  preload() { preloadCarTextures(this); }

  create() {
    currentWord = null; currentWordIdx = 0; wordCharDefs = null;
    showWordUI();
    this._drawBg();
    this._drawTitle();
    this._drawBgSelector();
    this._drawTabs();
    this._drawCards();
    this.cameras.main.fadeIn(300);
  }

  _drawBg() {
    const g = this.add.graphics();
    if (currentBg === 2) {
      g.fillGradientStyle(0x050514,0x050514,0x0D1B4A,0x0D1B4A); g.fillRect(0,0,W,H*0.65);
      g.fillStyle(0xFFFFFF);
      for(let i=0;i<90;i++){
        const sx=(i*137+23)%W, sy=(i*89+11)%(H*0.58), sz=(i%5===0)?1.8:(i%3===0)?1.2:0.7;
        g.fillCircle(sx,sy,sz);
      }
      this.add.circle(820,52,26,0xFFFAE0);
      const mg=this.add.graphics(); mg.fillStyle(0x0D1B4A); mg.fillCircle(832,44,22);
      g.fillStyle(0x060D14); g.fillRect(0,H*0.65,W,H*0.35);
      g.fillStyle(0x040B10); g.fillRect(0,H*0.70,W,H*0.30);
    } else if (currentBg === 1) {
      g.fillGradientStyle(0x1A0A40,0x1A0A40,0xB84010,0xB84010); g.fillRect(0,0,W,H*0.65);
      g.fillStyle(0xFF8C00,0.25); g.fillRect(0,H*0.42,W,H*0.23);
      this.add.circle(820,H*0.65-18,38,0xFF5500);
      g.fillStyle(0x1A4010); g.fillRect(0,H*0.65,W,H*0.35);
      g.fillStyle(0x153208); g.fillRect(0,H*0.70,W,H*0.30);
      drawClouds(this,[[60,60],[290,44],[560,62],[760,40]]);
    } else {
      g.fillGradientStyle(0x5CA8D8,0x5CA8D8,0x87CEEB,0x87CEEB); g.fillRect(0,0,W,H*0.65);
      g.fillStyle(0x558B2F); g.fillRect(0,H*0.65,W,H*0.35);
      g.fillStyle(0x455A64); g.fillRect(0,H*0.65,W,16);
      g.fillStyle(0xFFEB3B);
      for(let x=0;x<W;x+=40) g.fillRect(x,H*0.65+6,22,4);
      drawClouds(this,[[70,42],[310,30],[590,48],[790,36]]);
      this.add.circle(845,52,34,0xFFD54F);
    }
  }

  _drawTitle() {
    const titleColor = currentBg===2 ? '#aaddff' : '#fff';
    const subColor   = currentBg===2 ? '#88aacc' : '#FFF9C4';
    this.add.text(W/2,62,'🚗 자동차 주차 한글 🅿',{
      fontSize:'36px',fontFamily:'"Malgun Gothic",sans-serif',
      color:titleColor,stroke:'#1a237e',strokeThickness:5,
    }).setOrigin(0.5);
    this.add.text(W/2,104,'배울 글자를 골라보세요!',{
      fontSize:'18px',fontFamily:'"Malgun Gothic",sans-serif',color:subColor,
    }).setOrigin(0.5);
  }

  _drawBgSelector() {
    const labels = ['☀ 낮','🌇 저녁','🌙 밤'];
    const bw=72, bh=28, gap=8;
    labels.forEach((lbl, i) => {
      const bx = W - 12 - (labels.length - i)*(bw+gap) + gap;
      const by = 10;
      const isActive = i === currentBg;
      const bg = this.add.rectangle(bx+bw/2, by+bh/2, bw, bh,
        isActive ? 0x1565C0 : 0x000000, isActive ? 0.9 : 0.4)
        .setStrokeStyle(1.5, isActive ? 0x64B5F6 : 0x888888)
        .setInteractive({useHandCursor:true});
      this.add.text(bx+bw/2, by+bh/2, lbl, {
        fontSize:'11px', fontFamily:'"Malgun Gothic",sans-serif', color:'#fff',
      }).setOrigin(0.5).setDepth(1);
      bg.on('pointerdown',()=>{ currentBg=i; this.scene.restart(); });
      bg.on('pointerover',()=>bg.setFillStyle(0x1976D2,0.8));
      bg.on('pointerout',()=>bg.setFillStyle(isActive?0x1565C0:0x000000, isActive?0.9:0.4));
    });
  }

  _drawTabs() {
    const tabs = ['자음','모음'];
    const tw=110, th=36, gap=8;
    const totalTW = tabs.length*(tw+gap)-gap;
    const startX = (W-totalTW)/2;
    tabs.forEach((tab,i) => {
      const tx = startX + i*(tw+gap);
      const isActive = tab === currentTab;
      const bg = this.add.rectangle(tx+tw/2, 132, tw, th,
        isActive ? 0x1565C0 : 0x000000, isActive ? 0.88 : 0.35)
        .setStrokeStyle(2, isActive ? 0x64B5F6 : 0x666666)
        .setInteractive({useHandCursor:true});
      this.add.text(tx+tw/2, 132, tab+(tab==='자음'?' (14)':' (10)'), {
        fontSize:'15px', fontFamily:'"Malgun Gothic",sans-serif',
        color: isActive ? '#fff' : '#aaa',
      }).setOrigin(0.5).setDepth(1);
      bg.on('pointerdown',()=>{ currentTab=tab; this.scene.restart(); });
      bg.on('pointerover',()=>{ if(!isActive) bg.setFillStyle(0x0D47A1,0.6); });
      bg.on('pointerout', ()=>{ if(!isActive) bg.setFillStyle(0x000000,0.35); });
    });
  }

  _drawCards() {
    const list = CHAR_GROUPS[currentTab];
    const cardW=110, cardH=112, spacingX=22, spacingY=18;
    const perRow=5;
    const rowCount = Math.ceil(list.length/perRow);
    const totalW = perRow*cardW + (perRow-1)*spacingX;
    const totalH = rowCount*cardH + (rowCount-1)*spacingY;
    const startX = (W-totalW)/2;
    const startY = 162 + (H-162-totalH)/2;

    list.forEach((ch, idx) => {
      const row = Math.floor(idx/perRow);
      const col = idx % perRow;
      // for last row with fewer cards, center them
      const rowItems = (row === rowCount-1) ? (list.length - row*perRow) : perRow;
      const rowTotalW = rowItems*cardW + (rowItems-1)*spacingX;
      const rowStartX = (W-rowTotalW)/2;
      const cx = rowStartX + col*(cardW+spacingX) + cardW/2;
      const cy = startY + row*(cardH+spacingY) + cardH/2;

      const isNight = currentBg===2;
      const cardColor  = isNight ? 0x1A2A4A : 0xFFFFFF;
      const cardAlpha  = isNight ? 0.88 : 0.93;
      const strokeCol  = isNight ? 0x4A80C0 : 0x1565C0;
      const textColor  = isNight ? '#88ccff' : '#1A237E';
      const subColor   = isNight ? '#6699bb' : '#555';

      const bg = this.add.rectangle(cx,cy,cardW,cardH,cardColor,cardAlpha)
        .setStrokeStyle(4,strokeCol).setInteractive({useHandCursor:true});
      this.add.text(cx,cy-12,ch,{
        fontSize:'62px',fontFamily:'"Malgun Gothic",sans-serif',color:textColor,
      }).setOrigin(0.5);
      const cnt = CHARS[ch].type==='circle' ? CHARS[ch].count : CHARS[ch].path.length;
      this.add.text(cx,cy+44,`🚗 ${cnt}대`,{
        fontSize:'12px',fontFamily:'"Malgun Gothic",sans-serif',color:subColor,
      }).setOrigin(0.5);

      bg.on('pointerover',()=>{bg.setFillStyle(isNight?0x2A3A6A:0xE3F2FD,0.95);bg.setScale(1.05);});
      bg.on('pointerout', ()=>{bg.setFillStyle(cardColor,cardAlpha);bg.setScale(1);});
      bg.on('pointerdown',()=>{
        this.cameras.main.fadeOut(220);
        this.time.delayedCall(220,()=>this.scene.start('Game',{ch}));
      });
    });
  }
}

    } else {
      g.fillGradientStyle(0x4A90D9,0x4A90D9,0x87CEEB,0x87CEEB); g.fillRect(0,0,W,H*0.62);
      g.fillStyle(0x3d6b22); g.fillRect(0,H*0.62,W,H*0.38);
      g.fillStyle(0x4a7a2a); g.fillRect(0,H*0.67,W,H*0.33);
      g.fillStyle(0x48484a); g.fillRect(0,H*0.60,W,20);
      g.fillStyle(0x606062,0.8); g.fillRect(0,H*0.60,W,3);
      g.fillStyle(0x2a2a2c,0.9); g.fillRect(0,H*0.60+17,W,3);
      g.fillStyle(0xFFEB3B);
      for(let x=0;x<W;x+=40) g.fillRect(x,H*0.60+8,22,4);
      g.fillStyle(0x426b20,0.5);
      for(let x=0;x<W;x+=24) g.fillRect(x,H*0.65,3,8);

        sg.beginPath();sg.moveTo(845+dx*0.85,50+dy*0.85);sg.lineTo(845+dx,50+dy);sg.strokePath();
      });

  }

  _drawAsphalt(g, x, y, w, h, radius=14) {
    g.fillStyle(0x000000, 0.38); g.fillRoundedRect(x+5, y+7, w, h, radius);
    g.fillStyle(0x3c3c3c); g.fillRoundedRect(x, y, w, h, radius);
    g.fillStyle(0x424242, 0.6); g.fillRoundedRect(x+3, y+3, w-6, h-6, radius-2);
    g.fillStyle(0x555555, 0.55);
    for(let i=0;i<60;i++){
      g.fillRect(x+4+((i*47+31)%(w-8)), y+4+((i*61+17)%(h-8)), 2, 2);
    }
    g.fillStyle(0x282828, 0.4);
    for(let i=0;i<35;i++){
      g.fillRect(x+4+((i*71+53)%(w-8)), y+4+((i*43+29)%(h-8)), 1.5, 1.5);
    }
    g.lineStyle(2.5, 0x606060, 0.9);
    g.beginPath(); g.moveTo(x+radius, y); g.lineTo(x+w-radius, y);
    g.moveTo(x, y+radius); g.lineTo(x, y+h-radius); g.strokePath();
    g.lineStyle(2.5, 0x1a1a1a, 0.9);
    g.beginPath(); g.moveTo(x+radius, y+h); g.lineTo(x+w-radius, y+h);
    g.moveTo(x+w, y+radius); g.lineTo(x+w, y+h-radius); g.strokePath();
    g.lineStyle(1.5, 0x505050, 0.8); g.strokeRoundedRect(x, y, w, h, radius);
  }

  _makeLot() {
    // 단어 모드: 미리 계산된 레이아웃 사용 (fonts.ready 보장됨)
    const def = (this.wordMode && wordCharDefs && wordCharDefs[currentWordIdx])
      ? wordCharDefs[currentWordIdx]
      : getCharDef(this.ch);
    if (def.type === 'circle') this._makeCircleLot(def);
    else this._makePathLot(def);
  }

  _makePathLot({path, rows, cols}) {
    const pad = 18;
    // 그리드가 크면 셀 크기를 자동으로 줄여서 화면에 맞춤
    const BOX_AREA = 190;  // 장난감 통 폭 + 여백
    const maxByW = Math.floor((W - BOX_AREA - 44*2 - pad*2) / cols);
    const maxByH = Math.floor((H - 100 - pad*2) / rows);
    const cs = Math.min(CS, maxByW, maxByH);

    const lotW = cols*cs - GAP + pad*2;
    const lotH = rows*cs - GAP + pad*2;
    const ox = 44, oy = Math.round((H - lotH)/2) + 12;

    const g = this.add.graphics();
    this._drawAsphalt(g, ox-pad, oy-pad, lotW, lotH);

    // 글자 워터마크 (주차장 위에 희미하게 글자 표시)
    const ghostSize = Math.min(lotW, lotH) * 0.78;
    this.add.text(ox-pad + lotW/2, oy-pad + lotH/2, this.ch, {
      fontSize: `${Math.round(ghostSize)}px`,
      fontFamily: '"Malgun Gothic","Apple SD Gothic Neo",sans-serif',
      color: '#ffffff',
    }).setOrigin(0.5).setAlpha(0.07).setDepth(1);

    this.add.text(
      ox + (cols*cs - GAP)/2, oy - pad - 2,
      this.ch + '  🔊',
      {fontSize:'50px',fontFamily:'"Malgun Gothic",sans-serif',color:'#FFD700',stroke:'#1a1a00',strokeThickness:5}
    ).setOrigin(0.5,1).setInteractive({useHandCursor:true})
     .on('pointerdown',()=>speak(this.ch));

    path.forEach(([row, col], idx) => {
      const angle = cellAngle(path, idx);
      const cx = ox + col*cs + cs/2;
      const cy = oy + row*cs + cs/2;
      const sg = this.add.graphics();
      this._slotEmptyCs(sg, cx, cy, angle, cs);
      const arrow = this.add.text(cx, cy, '↑', {fontSize:`${Math.round(cs*0.24)}px`,color:'#ffffff',alpha:0.35})
        .setOrigin(0.5).setAngle(angle).setDepth(2);
      this.slots.push({x:cx, y:cy, angle, filled:false, car:null, type:null, sg, arrow, cs});
    });
    this.totalSlots = path.length;
    this._lotCs = cs;
  }

  _makeCircleLot({count}) {
    const carLen = SVG_H * S_PARK;
    const R = Math.round(count * carLen / (2 * Math.PI));
    const cx = Math.round(W * 0.37), cy = Math.round(H / 2) + 8;
    const outerR = R + CS * 0.58;
    const innerR = R - CS * 0.58;

    const g = this.add.graphics();
    g.fillStyle(0x000000, 0.35); g.fillCircle(cx+5, cy+7, outerR);
    g.fillStyle(0x3c3c3c); g.fillCircle(cx, cy, outerR);
    g.fillStyle(0x424242, 0.5); g.fillCircle(cx, cy, outerR-3);
    g.fillStyle(0x555555, 0.5);
    for(let i=0;i<50;i++){
      const a=(i/50)*Math.PI*2, r2=innerR+4+((i*37)%(outerR-innerR-8));
      g.fillRect(cx+r2*Math.cos(a)-1, cy+r2*Math.sin(a)-1, 2, 2);
    }
    g.lineStyle(2.5, 0x606060, 0.8);
    g.beginPath(); g.arc(cx,cy,outerR,-Math.PI*0.75,-Math.PI*0.25); g.strokePath();
    g.lineStyle(2.5, 0x1a1a1a, 0.8);
    g.beginPath(); g.arc(cx,cy,outerR,Math.PI*0.25,Math.PI*0.75); g.strokePath();
    g.lineStyle(1.5, 0x505050, 0.8); g.strokeCircle(cx, cy, outerR);
    if (innerR > 15) {
      g.fillStyle(0x3d6b22); g.fillCircle(cx, cy, innerR);
      g.fillStyle(0x4a7a2a, 0.7); g.fillCircle(cx, cy, innerR-4);
      g.lineStyle(2, 0x2e5018, 0.7); g.strokeCircle(cx, cy, innerR);
      g.fillStyle(0x426b20, 0.5);
      for(let i=0;i<16;i++){
        const a=(i/16)*Math.PI*2, r3=innerR*0.5;
        g.fillRect(cx+r3*Math.cos(a)-1, cy+r3*Math.sin(a)-1, 3, 5);
      }
    }

    this.add.text(cx, cy - outerR - 2, this.ch + '  🔊', {
      fontSize:'50px', fontFamily:'"Malgun Gothic",sans-serif',
      color:'#FFD700', stroke:'#1a1a00', strokeThickness:5,
    }).setOrigin(0.5,1).setInteractive({useHandCursor:true})
     .on('pointerdown',()=>speak(this.ch));

    for (let i = 0; i < count; i++) {
      const θ  = -Math.PI/2 + (i   / count) * 2*Math.PI;
      const θn = -Math.PI/2 + ((i+1) / count) * 2*Math.PI;
      const sx = cx + R * Math.cos(θ);
      const sy = cy + R * Math.sin(θ);
      const dx = Math.cos(θn) - Math.cos(θ);
      const dy = Math.sin(θn) - Math.sin(θ);
      const angle = Math.round((Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360);
      const sg = this.add.graphics();
      this._slotEmpty(sg, sx, sy, angle);
      const arrow = this.add.text(sx, sy, '↑', {fontSize:'20px',color:'#ffffff',alpha:0.35})
        .setOrigin(0.5).setAngle(angle).setDepth(2);
      this.slots.push({x:sx, y:sy, angle, filled:false, car:null, type:null, sg, arrow});
    }
    this.totalSlots = count;
  }

  _slotEmpty(g, cx, cy, angle, cs) { this._slotEmptyCs(g, cx, cy, angle, cs||CS); }
  _slotEmptyCs(g, cx, cy, angle, cs) {
    g.clear();
    const isHoriz = (angle === 90 || angle === 270);
    const sw = isHoriz ? cs : cs * 0.52;
    const sh = isHoriz ? cs * 0.52 : cs;
    const x = cx - sw/2, y = cy - sh/2;
    g.fillStyle(0x262626); g.fillRect(x, y, sw, sh);
    g.lineStyle(3, 0x0d0d0d, 0.9);
    g.beginPath(); g.moveTo(x,y+sh); g.lineTo(x,y); g.lineTo(x+sw,y); g.strokePath();
    g.lineStyle(2, 0x484848, 0.7);
    g.beginPath(); g.moveTo(x+sw,y); g.lineTo(x+sw,y+sh); g.lineTo(x,y+sh); g.strokePath();
    g.lineStyle(2.5, 0xffffff, 0.70);
    if (isHoriz) {
      g.beginPath(); g.moveTo(x+5,y+2); g.lineTo(x+sw-5,y+2); g.strokePath();
      g.beginPath(); g.moveTo(x+5,y+sh-2); g.lineTo(x+sw-5,y+sh-2); g.strokePath();
    } else {
      g.beginPath(); g.moveTo(x+2,y+5); g.lineTo(x+2,y+sh-5); g.strokePath();
      g.beginPath(); g.moveTo(x+sw-2,y+5); g.lineTo(x+sw-2,y+sh-5); g.strokePath();
    }
    g.lineStyle(1.2, 0xffffff, 0.18);
    g.beginPath();
    if(isHoriz){ g.moveTo(x+sw*0.25,cy); g.lineTo(x+sw*0.75,cy); }
    else        { g.moveTo(cx,y+sh*0.25); g.lineTo(cx,y+sh*0.75); }
    g.strokePath();
  }

  _slotFilled(g, cx, cy, cs) {
    cs = cs || CS;
    g.clear();
    g.fillStyle(0x1a4a1a, 0.9);
    g.fillRoundedRect(cx-cs*0.48, cy-cs*0.48, cs*0.96, cs*0.96, 7);
    g.fillStyle(0x2e7d32, 0.7);
    g.fillRoundedRect(cx-cs*0.42, cy-cs*0.42, cs*0.84, cs*0.84, 5);
    g.lineStyle(2.5, 0x66BB6A, 0.9);
    g.strokeRoundedRect(cx-cs*0.48, cy-cs*0.48, cs*0.96, cs*0.96, 7);
    g.lineStyle(1.5, 0xa5d6a7, 0.5);
    g.strokeRoundedRect(cx-cs*0.42, cy-cs*0.42, cs*0.84, cs*0.84, 5);
  }

  _makeToyBox() {
    this.bx=W-172; this.by=58; this.bw=148; this.bh=H-102;
    const g=this.add.graphics();
    g.fillStyle(0,0.18); g.fillRoundedRect(this.bx+4,this.by+4,this.bw,this.bh,14);
    g.fillStyle(0x795548); g.fillRoundedRect(this.bx,this.by,this.bw,this.bh,14);
    g.fillStyle(0x8D6E63); g.fillRoundedRect(this.bx+5,this.by+5,this.bw-10,this.bh-10,11);
    g.lineStyle(3,0x4E342E); g.strokeRoundedRect(this.bx,this.by,this.bw,this.bh,14);
    this.add.text(this.bx+this.bw/2,this.by+18,'🧺 장난감 통',{
      fontSize:'14px',fontFamily:'"Malgun Gothic",sans-serif',color:'#FFF8E1',
    }).setOrigin(0.5);

    this.boxCars=[];
    const count = Math.max(this.totalSlots, 14);
    const rows = Math.ceil(count / 2);
    const sp = (this.bh-54) / rows;
    const types = Phaser.Utils.Array.Shuffle([...CAR_TYPE_KEYS]);
    for(let i=0;i<count;i++){
      const col = i % 2;
      const row = Math.floor(i / 2);
      const cx = this.bx + (col===0 ? this.bw*0.27 : this.bw*0.73);
      const cy = this.by+44+row*sp+sp/2;
      const type=types[i % types.length];
      const car=this.add.image(cx,cy,'car_'+type).setScale(S_BOX).setAngle(90).setDepth(3);
      this.boxCars.push({x:cx,y:cy,type,sprite:car});
    }
  }

  _makeUI() {
    this.progText=this.add.text(W/2-50,14,`0 / ${this.totalSlots}`,{
      fontSize:'24px',fontFamily:'"Malgun Gothic",sans-serif',
      color:'#FFD700',stroke:'#000',strokeThickness:3,
    }).setOrigin(0.5);
    this.add.text(W/2-50,44,'자동차를 주차칸에 올려봐요! 🚗',{
      fontSize:'14px',fontFamily:'"Malgun Gothic",sans-serif',color:'#E0F7FA',
    }).setOrigin(0.5);
    this.add.text(16,14,'◀ 메뉴',{
      fontSize:'17px',fontFamily:'"Malgun Gothic",sans-serif',
      color:'#fff',backgroundColor:'#00000066',padding:{x:8,y:4},
    }).setInteractive({useHandCursor:true})
      .on('pointerdown',()=>{
        this.cameras.main.fadeOut(200);
        this.time.delayedCall(200,()=>this.scene.start('Menu'));
      });

    // 단어 모드: 상단 우측에 진행 글자 타일 표시
    if (this.wordMode && currentWord) {
      const tileW=44, tileH=44, gap=6;
      const n = currentWord.length;
      const totalW = n*(tileW+gap)-gap;
      let sx = W - 172 - totalW - 16;  // 장난감 통 왼쪽
      currentWord.forEach((ch, i) => {
        const tx = sx + i*(tileW+gap) + tileW/2;
        const ty = 36;
        const done = i < currentWordIdx;
        const active = i === currentWordIdx;
        const bg = this.add.rectangle(tx,ty,tileW,tileH,
          done ? 0x2e7d32 : active ? 0x1565C0 : 0x000000,
          done ? 0.9 : active ? 0.88 : 0.45)
          .setStrokeStyle(2, done ? 0x66BB6A : active ? 0x64B5F6 : 0x555555);
        this.add.text(tx,ty,ch,{
          fontSize:'22px',fontFamily:'"Malgun Gothic",sans-serif',
          color: done ? '#a5d6a7' : active ? '#fff' : '#888',
        }).setOrigin(0.5);
        if (done) this.add.text(tx+14,ty-14,'✓',{fontSize:'12px',color:'#66BB6A'}).setOrigin(0.5);
      });
    }
  }

  _input() {
    this.input.on('pointerdown',(p)=>{
      if(this.won) return;
      if(this.dragCar){
        if(p.x>=this.bx&&p.x<=this.bx+this.bw&&p.y>=this.by&&p.y<=this.by+this.bh){
          const car=this.dragCar; const type=this.dragType;
          const {ox:rx, oy:ry}=this.dragOrigin;
          this.dragCar=null;
          car.setAngle(90);
          this.tweens.add({targets:car,x:rx,y:ry,scaleX:S_BOX,scaleY:S_BOX,duration:220,ease:'Back.Out',
            onComplete:()=>{
              this.boxCars.push({x:rx,y:ry,type,sprite:car});
              this.boxCars.sort((a,b)=>a.y-b.y);
            }
          });
          return;
        }
        let best=null, bestD=Infinity;
        for(const s of this.slots){
          if(s.filled) continue;
          const d=Phaser.Math.Distance.Between(p.x,p.y,s.x,s.y);
          const snapR=(s.cs||CS)*0.98;
          if(d<snapR&&d<bestD){bestD=d;best=s;}
        }
        if(best){
          this._park(best);
        } else {
          const car=this.dragCar; this.dragCar=null;
          car.setPosition(p.x,p.y).setScale(S_PARK).setAngle(90).setDepth(4);
          this.groundCars.push({sprite:car, type:this.dragType});
        }
        return;
      }
      for(let i=0;i<this.groundCars.length;i++){
        const gc=this.groundCars[i];
        if(Phaser.Math.Distance.Between(p.x,p.y,gc.sprite.x,gc.sprite.y)<44){
          gc.sprite.destroy(); this.groundCars.splice(i,1);
          this._grab(p,gc.type); return;
        }
      }
      if(p.x>=this.bx&&p.x<=this.bx+this.bw&&p.y>=this.by&&p.y<=this.by+this.bh){
        if(this.boxCars.length===0) return;
        let best=null, bestD=Infinity;
        for(const bc of this.boxCars){
          const d=Phaser.Math.Distance.Between(p.x,p.y,bc.x,bc.y);
          if(d<bestD){bestD=d;best=bc;}
        }
        if(!best) return;
        best.sprite.destroy();
        this.boxCars=this.boxCars.filter(bc=>bc!==best);
        this.dragOrigin={ox:best.x, oy:best.y};
        this._grab(p,best.type);
        return;
      }
      for(const s of this.slots){
        if(!s.filled) continue;
        const r=(s.cs||CS)/2+6;
        if(Math.abs(p.x-s.x)<r&&Math.abs(p.y-s.y)<r){
          this._unpark(s,p); return;
        }
      }
    });
    this.input.on('pointermove',(p)=>{
      if(this.dragCar) this.dragCar.setPosition(p.x,p.y);
    });
  }

  _grab(p, type) {
    this.dragType = type;
    if(!this.dragOrigin) this.dragOrigin={ox:this.bx+this.bw/2, oy:this.by+this.bh/2};
    this.dragCar = this.add.image(p.x, p.y, 'car_'+type).setScale(S_DRAG).setAngle(90).setDepth(15);
  }

  _park(slot) {
    const car=this.dragCar; this.dragCar=null;
    const sc = slot.cs ? S_PARK * Math.min(1, slot.cs/CS) : S_PARK;
    car.setPosition(slot.x,slot.y).setScale(sc).setAngle(slot.angle).setDepth(3);
    slot.filled=true; slot.car=car; slot.type=this.dragType; slot._parkScale=sc;
    this._slotFilled(slot.sg,slot.x,slot.y,slot.cs);
    slot.arrow.setVisible(false);
    this.filled++; this._updateProg();
    const sc2=slot._parkScale||S_PARK;
    this.tweens.add({targets:car,scaleX:sc2*1.12,scaleY:sc2*1.12,yoyo:true,duration:85,onComplete:()=>car.setScale(sc2)});
    if(this.filled===this.totalSlots) this.time.delayedCall(350,()=>this._win());
  }

  _unpark(slot, p) {
    slot.car.destroy(); slot.car=null;
    this.dragType=slot.type; slot.filled=false; slot.type=null;
    this.filled--;
    this._slotEmptyCs(slot.sg,slot.x,slot.y,slot.angle,slot.cs||CS);
    slot.arrow.setVisible(true);
    this._updateProg();
    this._grab(p, this.dragType);
  }

  _updateProg(){this.progText.setText(`${this.filled} / ${this.totalSlots}`);}

  _win() {
    this.won=true;
    const em=['⭐','🎉','✨','🌟','🎊','🚗'];
    for(let i=0;i<42;i++){
      const t=this.add.text(
        Phaser.Math.Between(60,W-60),Phaser.Math.Between(60,H-60),
        em[i%em.length],{fontSize:`${Phaser.Math.Between(20,38)}px`}
      ).setAlpha(0).setDepth(20);
      this.tweens.add({targets:t,alpha:1,y:t.y-Phaser.Math.Between(50,90),delay:i*42,duration:480,yoyo:true,ease:'Power2',onComplete:()=>t.destroy()});
    }

    // 단어 모드: 마지막 글자인지 확인
    const isWordMode = this.wordMode && currentWord;
    const isLastWordChar = isWordMode && (currentWordIdx >= currentWord.length - 1);

    this.time.delayedCall(500,()=>{
      this.add.rectangle(W/2,H/2,W,H,0x000,0.55).setDepth(30);
      this.add.rectangle(W/2,H/2,460,330,0xFFFDE7).setDepth(31).setStrokeStyle(7,0xFFD700);

      if (isWordMode && isLastWordChar) {
        // 단어 전체 완성!
        const word = currentWord.join('');
        this.add.text(W/2,H/2-125,'🎊 단어 완성! 🎊',{fontSize:'28px',fontFamily:'"Malgun Gothic",sans-serif',color:'#333'}).setOrigin(0.5).setDepth(32);
        const wt=this.add.text(W/2,H/2-30,word,{
          fontSize: word.length<=3?'90px':'66px',
          fontFamily:'"Malgun Gothic",sans-serif',color:'#D32F2F',
        }).setOrigin(0.5).setDepth(32);
        this.tweens.add({targets:wt,scaleX:1.18,scaleY:1.18,yoyo:true,duration:280,repeat:2});
        this.add.text(W/2,H/2+66,'👏 단어를 모두 주차했어요! 👏',{fontSize:'21px',fontFamily:'"Malgun Gothic",sans-serif',color:'#1565C0'}).setOrigin(0.5).setDepth(32);
        speak(word);
        this._btn(W/2,H/2+108,'🔊 단어 읽기',0x00838F,()=>speak(word));
        this._btn(W/2-110,H/2+152,'🔄 다시 하기',0x388E3C,()=>{
          currentWordIdx=0;
          this.cameras.main.fadeOut(200);
          this.time.delayedCall(200,()=>this.scene.start('Game',{ch:currentWord[0],wordMode:true}));
        });
        this._btn(W/2+110,H/2+152,'메뉴로 ▶',0x1565C0,()=>{
          this.cameras.main.fadeOut(200);this.time.delayedCall(200,()=>this.scene.start('Menu'));
        });
      } else if (isWordMode) {
        // 단어 모드 중간 글자 완성
        this.add.text(W/2,H/2-120,`${currentWordIdx+1} / ${currentWord.length} 완성! ⭐`,{fontSize:'22px',fontFamily:'"Malgun Gothic",sans-serif',color:'#555'}).setOrigin(0.5).setDepth(32);
        const ct=this.add.text(W/2,H/2-28,this.ch,{fontSize:'100px',fontFamily:'"Malgun Gothic",sans-serif',color:'#D32F2F'}).setOrigin(0.5).setDepth(32);
        this.tweens.add({targets:ct,scaleX:1.2,scaleY:1.2,yoyo:true,duration:280,repeat:2});
        const nextCh = currentWord[currentWordIdx+1];
        this.add.text(W/2,H/2+60,`다음 글자: ${nextCh}`,{fontSize:'22px',fontFamily:'"Malgun Gothic",sans-serif',color:'#1565C0'}).setOrigin(0.5).setDepth(32);
        speak(this.ch);
        let advanced = false;
        this._btn(W/2,H/2+108,'다음 글자 ▶',0x1565C0,()=>{
          if (advanced) return; advanced = true;
          currentWordIdx++;
          this.cameras.main.fadeOut(200);
          this.time.delayedCall(200,()=>this.scene.start('Game',{ch:nextCh,wordMode:true}));
        });
      } else {
        // 일반 모드
        this.add.text(W/2,H/2-115,'🎊 완성! 잘했어요! 🎊',{fontSize:'30px',fontFamily:'"Malgun Gothic",sans-serif',color:'#333'}).setOrigin(0.5).setDepth(32);
        const ct=this.add.text(W/2,H/2-28,this.ch,{fontSize:'100px',fontFamily:'"Malgun Gothic",sans-serif',color:'#D32F2F'}).setOrigin(0.5).setDepth(32);
        this.tweens.add({targets:ct,scaleX:1.2,scaleY:1.2,yoyo:true,duration:280,repeat:2});
        this.add.text(W/2,H/2+62,'👏 브라보! 정말 잘했어요! 👏',{fontSize:'24px',fontFamily:'"Malgun Gothic",sans-serif',color:'#1565C0'}).setOrigin(0.5).setDepth(32);
        speak(this.ch);
        this._btn(W/2,H/2+106,'🔊 다시 읽기',0x00838F,()=>speak(this.ch));
        this._btn(W/2-100,H/2+150,'🔄 다시 하기',0x388E3C,()=>{this.cameras.main.fadeOut(200);this.time.delayedCall(200,()=>this.scene.restart({ch:this.ch}));});
        this._btn(W/2+100,H/2+150,'다음 글자 ▶',0x1565C0,()=>{
          const list = CHAR_GROUPS[currentTab];
          const next = list[(list.indexOf(this.ch)+1)%list.length];
          this.cameras.main.fadeOut(200);this.time.delayedCall(200,()=>this.scene.start('Game',{ch:next}));
        });
      }
    });
  }

  _btn(x,y,label,color,cb){
    const btn=this.add.rectangle(x,y,172,44,color).setDepth(32).setInteractive({useHandCursor:true});
    this.add.text(x,y,label,{fontSize:'16px',fontFamily:'"Malgun Gothic",sans-serif',color:'#fff'}).setOrigin(0.5).setDepth(33);
    btn.on('pointerover',()=>{const c=Phaser.Display.Color.IntegerToColor(color);c.lighten(15);btn.setFillStyle(c.color);});
    btn.on('pointerout',()=>btn.setFillStyle(color));
    btn.on('pointerdown',cb);
  }
}

window.__phaserGame = new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  resolution: window.devicePixelRatio || 1,
  parent: document.body,
  backgroundColor: '#0a0a20',
  scene: [MenuScene, GameScene],
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
});
</script>
</body>
</html>
