<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>자동차 주차 한글 게임</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a237e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
const W = 900, H = 580;
const CS = 92;   // cell pitch (center-to-center)
const GAP = 0;
const SVG_W = 58, SVG_H = 126;
const S_PARK = 0.78, S_DRAG = 0.72, S_BOX = 0.40;
// 주차 시 차 렌더 크기: 45 × 98 px

// ── 탑뷰 자동차 SVG (세로로 더 긴 버전, 흰색 차체 → Phaser tint 채색) ───────
const CAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="58" height="126">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ccc"/>
      <stop offset="18%"  stop-color="#fff"/>
      <stop offset="82%"  stop-color="#fff"/>
      <stop offset="100%" stop-color="#ccc"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ddd"/>
      <stop offset="50%"  stop-color="#fff"/>
      <stop offset="100%" stop-color="#ddd"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 뒷바퀴 -->
  <rect x="1"  y="16" width="12" height="24" rx="5" fill="#1a1a1a"/>
  <rect x="45" y="16" width="12" height="24" rx="5" fill="#1a1a1a"/>
  <!-- 앞바퀴 -->
  <rect x="1"  y="86" width="12" height="24" rx="5" fill="#1a1a1a"/>
  <rect x="45" y="86" width="12" height="24" rx="5" fill="#1a1a1a"/>
  <!-- 휠 림 -->
  <circle cx="7"  cy="28" r="4.5" fill="#888"/><circle cx="7"  cy="28" r="2" fill="#bbb"/>
  <circle cx="51" cy="28" r="4.5" fill="#888"/><circle cx="51" cy="28" r="2" fill="#bbb"/>
  <circle cx="7"  cy="98" r="4.5" fill="#888"/><circle cx="7"  cy="98" r="2" fill="#bbb"/>
  <circle cx="51" cy="98" r="4.5" fill="#888"/><circle cx="51" cy="98" r="2" fill="#bbb"/>
  <!-- 차체 -->
  <rect x="5" y="10" width="48" height="106" rx="10" fill="url(#body)" filter="url(#sh)"/>
  <!-- 트렁크(뒤=위) -->
  <rect x="7" y="12" width="44" height="20" rx="7" fill="rgba(0,0,0,0.1)"/>
  <!-- 후드(앞=아래) -->
  <rect x="7" y="94" width="44" height="20" rx="7" fill="rgba(0,0,0,0.1)"/>
  <!-- 뒷유리 -->
  <rect x="12" y="19" width="34" height="16" rx="4" fill="#7ec8e3" opacity="0.65"/>
  <!-- 앞유리 -->
  <rect x="12" y="91" width="34" height="16" rx="4" fill="#7ec8e3" opacity="0.85"/>
  <!-- 루프 -->
  <rect x="11" y="35" width="36" height="56" rx="6" fill="url(#roof)"/>
  <rect x="11" y="35" width="36" height="56" rx="6" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <!-- 도어라인 -->
  <line x1="7" y1="63" x2="51" y2="63" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"/>
  <!-- 테일라이트 -->
  <rect x="8"  y="12" width="11" height="8" rx="2.5" fill="#ff2222" opacity="0.9"/>
  <rect x="39" y="12" width="11" height="8" rx="2.5" fill="#ff2222" opacity="0.9"/>
  <!-- 헤드라이트 -->
  <rect x="8"  y="106" width="11" height="8" rx="2.5" fill="#fffde0" opacity="0.95"/>
  <rect x="39" y="106" width="11" height="8" rx="2.5" fill="#fffde0" opacity="0.95"/>
  <rect x="9"  y="107" width="5"  height="3" rx="1"   fill="white"  opacity="0.9"/>
  <rect x="40" y="107" width="5"  height="3" rx="1"   fill="white"  opacity="0.9"/>
</svg>`;

const CAR_COLORS = [0xE53935,0x1E88E5,0x43A047,0xF9A825,0x8E24AA,0xF4511E,0xEC407A,0x00ACC1,0x00897B,0x6D4C41];

const CHARS = {
  'ㄱ': { path:[[0,0],[0,1],[0,2],[1,2],[2,2]], rows:3, cols:3 },
  'ㄴ': { path:[[0,0],[1,0],[1,1],[1,2]],        rows:2, cols:3 },
  'ㄷ': { path:[[0,2],[0,1],[0,0],[1,0],[2,0],[2,1],[2,2]], rows:3, cols:3 },
  'ㅁ': { path:[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]], rows:3, cols:3 },
  'ㅇ': { type:'circle', count:10 },
};
const CHAR_LIST = ['ㄱ','ㄴ','ㄷ','ㅁ','ㅇ'];

// Phaser angle: 0=위 기준, 시계방향 (deg)
function cellAngle(path, i) {
  let dR, dC;
  if (i < path.length - 1) {
    dR = path[i+1][0] - path[i][0];
    dC = path[i+1][1] - path[i][1];
  } else {
    dR = path[i][0] - path[i-1][0];
    dC = path[i][1] - path[i-1][1];
  }
  if (dC > 0) return 90;
  if (dC < 0) return 270;
  if (dR > 0) return 180;
  return 0;
}

let carBlobUrl = null;
function loadCarTexture(scene) {
  if (scene.textures.exists('car')) return;
  if (!carBlobUrl) {
    carBlobUrl = URL.createObjectURL(new Blob([CAR_SVG], { type:'image/svg+xml' }));
  }
  scene.load.image('car', carBlobUrl);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.75; u.pitch=1.3;
  window.speechSynthesis.speak(u);
}

function drawClouds(scene, positions) {
  positions.forEach(([x,y]) => {
    const g = scene.add.graphics().fillStyle(0xffffff,0.82);
    [[0,0,22],[21,-6,26],[44,0,20],[21,12,18]].forEach(([dx,dy,r])=>g.fillCircle(x+dx,y+dy,r));
  });
}

// ── MenuScene ─────────────────────────────────────────────────────────────
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  preload() { loadCarTexture(this); }

  create() {
    const g = this.add.graphics();
    g.fillGradientStyle(0x5CA8D8,0x5CA8D8,0x87CEEB,0x87CEEB);
    g.fillRect(0,0,W,H*0.65);
    g.fillStyle(0x558B2F); g.fillRect(0,H*0.65,W,H*0.35);
    g.fillStyle(0x455A64); g.fillRect(0,H*0.65,W,16);
    g.fillStyle(0xFFEB3B);
    for(let x=0;x<W;x+=40) g.fillRect(x,H*0.65+6,22,4);
    drawClouds(this,[[70,42],[310,30],[590,48],[790,36]]);
    this.add.circle(845,52,34,0xFFD54F);

    this.add.text(W/2,85,'🚗 자동차 주차 한글 🅿',{
      fontSize:'40px',fontFamily:'"Malgun Gothic",sans-serif',
      color:'#fff',stroke:'#1a237e',strokeThickness:5,
    }).setOrigin(0.5);
    this.add.text(W/2,148,'배울 글자를 골라보세요!',{
      fontSize:'22px',fontFamily:'"Malgun Gothic",sans-serif',color:'#FFF9C4',
    }).setOrigin(0.5);

    const n = CHAR_LIST.length;
    const cardW = 138, spacing = (W - 60) / n;
    CHAR_LIST.forEach((ch, i) => {
      const x = 30 + spacing/2 + i*spacing, y = 345;
      const bg = this.add.rectangle(x,y,cardW,165,0xFFFFFF,0.93)
        .setStrokeStyle(5,0x1565C0).setInteractive({useHandCursor:true});
      this.add.text(x,y-14,ch,{
        fontSize:'80px',fontFamily:'"Malgun Gothic",sans-serif',color:'#1A237E',
      }).setOrigin(0.5);
      const cnt = CHARS[ch].type==='circle' ? CHARS[ch].count : CHARS[ch].path.length;
      this.add.text(x,y+64,`자동차 ${cnt}대`,{
        fontSize:'14px',fontFamily:'"Malgun Gothic",sans-serif',color:'#555',
      }).setOrigin(0.5);

      bg.on('pointerover',()=>{bg.setFillStyle(0xE3F2FD,0.95);bg.setScale(1.04);});
      bg.on('pointerout', ()=>{bg.setFillStyle(0xFFFFFF,0.93);bg.setScale(1);});
      bg.on('pointerdown',()=>{
        this.cameras.main.fadeOut(220);
        this.time.delayedCall(220,()=>this.scene.start('Game',{ch}));
      });
    });
    this.cameras.main.fadeIn(300);
  }
}

// ── GameScene ─────────────────────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }
  preload() { loadCarTexture(this); }

  init({ch}) {
    this.ch=ch; this.slots=[];
    this.filled=0; this.dragCar=null; this.dragColor=0; this.won=false;
    this.toyColors=Phaser.Utils.Array.Shuffle([...CAR_COLORS]);
  }

  create() {
    this._bg();
    this._makeLot();
    this._makeToyBox();
    this._makeUI();
    this._input();
    this.cameras.main.fadeIn(300);
  }

  _bg() {
    const g=this.add.graphics();
    g.fillGradientStyle(0x5CA8D8,0x5CA8D8,0x87CEEB,0x87CEEB);
    g.fillRect(0,0,W,H*0.62);
    g.fillStyle(0x4a7a30); g.fillRect(0,H*0.62,W,H*0.38);
    g.fillStyle(0x455A64); g.fillRect(0,H*0.62,W,16);
    g.fillStyle(0xFFEB3B);
    for(let x=0;x<W;x+=40) g.fillRect(x,H*0.62+5,22,4);
    drawClouds(this,[[50,38],[270,50],[530,34],[750,52]]);
    this.add.circle(845,50,30,0xFFD54F);
  }

  _makeLot() {
    const def = CHARS[this.ch];
    if (def.type === 'circle') this._makeCircleLot(def);
    else this._makePathLot(def);
  }

  _makePathLot({path, rows, cols}) {
    const pad = 18;
    const lotW = cols*CS - GAP + pad*2;
    const lotH = rows*CS - GAP + pad*2;
    const ox = 44, oy = Math.round((H - lotH)/2) + 12;

    const g = this.add.graphics();
    g.fillStyle(0x383838);
    g.fillRoundedRect(ox-pad, oy-pad, lotW, lotH, 14);
    g.lineStyle(3, 0x666);
    g.strokeRoundedRect(ox-pad, oy-pad, lotW, lotH, 14);

    this.add.text(
      ox + (cols*CS - GAP)/2, oy - pad - 2,
      this.ch + '  🔊',
      {fontSize:'50px',fontFamily:'"Malgun Gothic",sans-serif',color:'#FFD700',stroke:'#000',strokeThickness:4}
    ).setOrigin(0.5,1).setInteractive({useHandCursor:true})
     .on('pointerdown',()=>speak(this.ch));

    path.forEach(([row, col], idx) => {
      const angle = cellAngle(path, idx);
      const cx = ox + col*CS + CS/2;
      const cy = oy + row*CS + CS/2;
      const sg = this.add.graphics();
      this._slotEmpty(sg, cx, cy, angle);
      const arrow = this.add.text(cx, cy, '↑', {fontSize:'24px',color:'#FFEB3B',alpha:0.5})
        .setOrigin(0.5).setAngle(angle).setDepth(2);
      this.slots.push({x:cx, y:cy, angle, filled:false, car:null, color:0, sg, arrow});
    });
    this.totalSlots = path.length;
  }

  _makeCircleLot({count}) {
    // 반경: 차들이 꼬리를 물도록 원주 = count * 차 길이
    const carLen = SVG_H * S_PARK;  // ≈ 98 px
    const R = Math.round(count * carLen / (2 * Math.PI));
    const cx = Math.round(W * 0.37), cy = Math.round(H / 2) + 8;
    const outerR = R + CS * 0.58;
    const innerR = R - CS * 0.58;

    const g = this.add.graphics();
    g.fillStyle(0x383838);
    g.fillCircle(cx, cy, outerR);
    g.lineStyle(3, 0x666666);
    g.strokeCircle(cx, cy, outerR);
    if (innerR > 15) {
      g.fillStyle(0x4a7a30);
      g.fillCircle(cx, cy, innerR);
    }

    this.add.text(cx, cy - outerR - 2, this.ch + '  🔊', {
      fontSize:'50px', fontFamily:'"Malgun Gothic",sans-serif',
      color:'#FFD700', stroke:'#000', strokeThickness:4,
    }).setOrigin(0.5,1).setInteractive({useHandCursor:true})
     .on('pointerdown',()=>speak(this.ch));

    for (let i = 0; i < count; i++) {
      const θ  = -Math.PI/2 + (i   / count) * 2*Math.PI;
      const θn = -Math.PI/2 + ((i+1) / count) * 2*Math.PI;
      const sx = cx + R * Math.cos(θ);
      const sy = cy + R * Math.sin(θ);
      // 다음 슬롯 방향으로 차 머리가 향하도록 각도 계산
      const dx = Math.cos(θn) - Math.cos(θ);
      const dy = Math.sin(θn) - Math.sin(θ);
      const angle = Math.round((Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360);

      const sg = this.add.graphics();
      this._slotEmpty(sg, sx, sy, angle);
      const arrow = this.add.text(sx, sy, '↑', {fontSize:'22px',color:'#FFEB3B',alpha:0.5})
        .setOrigin(0.5).setAngle(angle).setDepth(2);
      this.slots.push({x:sx, y:sy, angle, filled:false, car:null, color:0, sg, arrow});
    }
    this.totalSlots = count;
  }

  _slotEmpty(g, cx, cy, angle) {
    g.clear();
    // 주차 칸: 차 방향 기준으로 가로폭 좁고 세로 긴 직사각형처럼 그리기
    const isHoriz = (angle === 90 || angle === 270);
    const sw = isHoriz ? CS : CS * 0.52;  // slot width  (주행 방향과 수직)
    const sh = isHoriz ? CS * 0.52 : CS;  // slot height (주행 방향과 평행)
    g.fillStyle(0x2a2a2a);
    g.fillRect(cx - sw/2, cy - sh/2, sw, sh);
    g.lineStyle(3, 0xFFEB3B, 0.85);
    g.strokeRect(cx - sw/2, cy - sh/2, sw, sh);
    // 중심 방향선
    g.lineStyle(1.5, 0xFFEB3B, 0.22);
    g.beginPath();
    g.moveTo(cx, cy - sh/2 + 6);
    g.lineTo(cx, cy + sh/2 - 6);
    g.strokePath();
  }

  _slotFilled(g, cx, cy) {
    g.clear();
    g.fillStyle(0x1B5E20);
    g.fillRoundedRect(cx - CS*0.48, cy - CS*0.48, CS*0.96, CS*0.96, 6);
    g.lineStyle(3, 0x66BB6A, 0.9);
    g.strokeRoundedRect(cx - CS*0.48, cy - CS*0.48, CS*0.96, CS*0.96, 6);
  }

  _makeToyBox() {
    this.bx=W-172; this.by=58; this.bw=148; this.bh=H-102;
    const g=this.add.graphics();
    g.fillStyle(0,0.18); g.fillRoundedRect(this.bx+4,this.by+4,this.bw,this.bh,14);
    g.fillStyle(0x795548); g.fillRoundedRect(this.bx,this.by,this.bw,this.bh,14);
    g.fillStyle(0x8D6E63); g.fillRoundedRect(this.bx+5,this.by+5,this.bw-10,this.bh-10,11);
    g.lineStyle(3,0x4E342E); g.strokeRoundedRect(this.bx,this.by,this.bw,this.bh,14);
    this.add.text(this.bx+this.bw/2,this.by+18,'🧺 장난감 통',{
      fontSize:'14px',fontFamily:'"Malgun Gothic",sans-serif',color:'#FFF8E1',
    }).setOrigin(0.5);

    this.boxCars=[];
    const count=7, sp=(this.bh-54)/count;
    for(let i=0;i<count;i++){
      const cx=this.bx+this.bw/2, cy=this.by+44+i*sp+sp/2;
      const color=this.toyColors[i%this.toyColors.length];
      const car=this.add.image(cx,cy,'car').setTint(color).setScale(S_BOX).setAngle(90).setDepth(3);
      this.boxCars.push({x:cx,y:cy,color,sprite:car});
    }
  }

  _makeUI() {
    this.progText=this.add.text(W/2-50,14,`0 / ${this.totalSlots}`,{
      fontSize:'24px',fontFamily:'"Malgun Gothic",sans-serif',
      color:'#FFD700',stroke:'#000',strokeThickness:3,
    }).setOrigin(0.5);
    this.add.text(W/2-50,44,'자동차를 주차칸에 올려봐요! 🚗',{
      fontSize:'14px',fontFamily:'"Malgun Gothic",sans-serif',color:'#E0F7FA',
    }).setOrigin(0.5);
    this.add.text(16,14,'◀ 메뉴',{
      fontSize:'17px',fontFamily:'"Malgun Gothic",sans-serif',
      color:'#fff',backgroundColor:'#00000066',padding:{x:8,y:4},
    }).setInteractive({useHandCursor:true})
      .on('pointerdown',()=>{
        this.cameras.main.fadeOut(200);
        this.time.delayedCall(200,()=>this.scene.start('Menu'));
      });
  }

  _input() {
    this.input.on('pointerdown',(p)=>{
      if(this.won) return;
      if(p.x>=this.bx&&p.x<=this.bx+this.bw&&p.y>=this.by&&p.y<=this.by+this.bh){
        let best=this.boxCars[0],bestD=Infinity;
        for(const bc of this.boxCars){
          const d=Phaser.Math.Distance.Between(p.x,p.y,bc.x,bc.y);
          if(d<bestD){bestD=d;best=bc;}
        }
        this._grab(p,best.color); return;
      }
      for(const s of this.slots){
        if(!s.filled) continue;
        if(Math.abs(p.x-s.x)<CS/2+6&&Math.abs(p.y-s.y)<CS/2+6){
          this._unpark(s,p); return;
        }
      }
    });

    // 드래그 중 주차 칸 근처에 오면 자동 주차
    const snapDist = SVG_H * S_PARK * 0.52; // ~51 px
    this.input.on('pointermove',(p)=>{
      if(!this.dragCar) return;
      this.dragCar.setPosition(p.x,p.y);
      let best=null,bestD=snapDist;
      for(const s of this.slots){
        if(s.filled) continue;
        const d=Phaser.Math.Distance.Between(p.x,p.y,s.x,s.y);
        if(d<bestD){bestD=d;best=s;}
      }
      if(best) this._park(best);
    });

    this.input.on('pointerup',(p)=>{
      if(!this.dragCar) return;
      // 손을 뗄 때도 가까운 슬롯 있으면 주차
      let best=null,bestD=72;
      for(const s of this.slots){
        if(s.filled) continue;
        const d=Phaser.Math.Distance.Between(p.x,p.y,s.x,s.y);
        if(d<bestD){bestD=d;best=s;}
      }
      if(best) this._park(best);
      // 슬롯 없으면 dragCar 유지 → 계속 드래그
    });
  }

  _grab(p,color) {
    this.dragColor=color;
    this.dragCar=this.add.image(p.x,p.y,'car').setTint(color).setScale(S_DRAG).setAngle(90).setDepth(15);
  }

  _park(slot) {
    const car=this.dragCar; this.dragCar=null;
    car.setPosition(slot.x,slot.y).setScale(S_PARK).setAngle(slot.angle).setDepth(3);
    slot.filled=true; slot.car=car; slot.color=this.dragColor;
    this._slotFilled(slot.sg,slot.x,slot.y);
    slot.arrow.setVisible(false);
    this.filled++; this._updateProg();
    this.tweens.add({targets:car,scaleX:S_PARK*1.12,scaleY:S_PARK*1.12,yoyo:true,duration:85,onComplete:()=>car.setScale(S_PARK)});
    if(this.filled===this.totalSlots) this.time.delayedCall(350,()=>this._win());
  }

  _unpark(slot,p) {
    slot.car.destroy(); slot.car=null;
    this.dragColor=slot.color; slot.filled=false; slot.color=0;
    this.filled--;
    this._slotEmpty(slot.sg,slot.x,slot.y,slot.angle);
    slot.arrow.setVisible(true);
    this._updateProg();
    this._grab(p,this.dragColor);
  }

  _updateProg(){this.progText.setText(`${this.filled} / ${this.totalSlots}`);}

  _win() {
    this.won=true;
    const em=['⭐','🎉','✨','🌟','🎊','🚗'];
    for(let i=0;i<42;i++){
      const t=this.add.text(
        Phaser.Math.Between(60,W-60),Phaser.Math.Between(60,H-60),
        em[i%em.length],{fontSize:`${Phaser.Math.Between(20,38)}px`}
      ).setAlpha(0).setDepth(20);
      this.tweens.add({targets:t,alpha:1,y:t.y-Phaser.Math.Between(50,90),delay:i*42,duration:480,yoyo:true,ease:'Power2',onComplete:()=>t.destroy()});
    }
    this.time.delayedCall(500,()=>{
      this.add.rectangle(W/2,H/2,W,H,0x000,0.55).setDepth(30);
      this.add.rectangle(W/2,H/2,440,320,0xFFFDE7).setDepth(31).setStrokeStyle(7,0xFFD700);
      this.add.text(W/2,H/2-115,'🎊 완성! 잘했어요! 🎊',{fontSize:'30px',fontFamily:'"Malgun Gothic",sans-serif',color:'#333'}).setOrigin(0.5).setDepth(32);
      const ct=this.add.text(W/2,H/2-28,this.ch,{fontSize:'100px',fontFamily:'"Malgun Gothic",sans-serif',color:'#D32F2F'}).setOrigin(0.5).setDepth(32);
      this.tweens.add({targets:ct,scaleX:1.2,scaleY:1.2,yoyo:true,duration:280,repeat:2});
      this.add.text(W/2,H/2+62,'👏 브라보! 정말 잘했어요! 👏',{fontSize:'24px',fontFamily:'"Malgun Gothic",sans-serif',color:'#1565C0'}).setOrigin(0.5).setDepth(32);
      speak(this.ch);
      this._btn(W/2,H/2+106,'🔊 다시 읽기',0x00838F,()=>speak(this.ch));
      this._btn(W/2-100,H/2+150,'🔄 다시 하기',0x388E3C,()=>{this.cameras.main.fadeOut(200);this.time.delayedCall(200,()=>this.scene.restart({ch:this.ch}));});
      this._btn(W/2+100,H/2+150,'다음 글자 ▶',0x1565C0,()=>{
        const next=CHAR_LIST[(CHAR_LIST.indexOf(this.ch)+1)%CHAR_LIST.length];
        this.cameras.main.fadeOut(200);this.time.delayedCall(200,()=>this.scene.start('Game',{ch:next}));
      });
    });
  }

  _btn(x,y,label,color,cb){
    const btn=this.add.rectangle(x,y,172,44,color).setDepth(32).setInteractive({useHandCursor:true});
    this.add.text(x,y,label,{fontSize:'16px',fontFamily:'"Malgun Gothic",sans-serif',color:'#fff'}).setOrigin(0.5).setDepth(33);
    btn.on('pointerover',()=>{const c=Phaser.Display.Color.IntegerToColor(color);c.lighten(15);btn.setFillStyle(c.color);});
    btn.on('pointerout',()=>btn.setFillStyle(color));
    btn.on('pointerdown',cb);
  }
}

new Phaser.Game({
  type:Phaser.AUTO, width:W, height:H,
  parent:document.body, backgroundColor:'#5CA8D8',
  scene:[MenuScene,GameScene],
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
});
</script>
